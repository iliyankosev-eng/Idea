name: probe-myfxbook
# One-off probe: can Myfxbook public pages be read from GitHub Actions? Raw HTML goes to the `probe-myfxbook` branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: bash scripts/probe/myfxbook-probe.sh
      - name: Push raw results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init --quiet -b probe-myfxbook
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "probe-myfxbook $(date -u +%FT%TZ)"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-myfxbook
