name: fx-matrix
# Dukascopy 1-minute gold/FX, one job per symbol-year (different runners, fewer throttled requests), then one commit
# to the `fxdata` branch. For experiments/fx-gold-preregistration.md.
on:
  workflow_dispatch:
    inputs:
      symbols:
        default: '["XAUUSD","EURUSD","GBPUSD","USDJPY"]'
      years:
        default: '[2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: ${{ fromJSON(inputs.symbols) }}
        year: ${{ fromJSON(inputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download one symbol-year
        env:
          THREADS: "2"
          BUDGET_MIN: "300"
        run: |
          END="${{ matrix.year }}-12-31"; [ "${{ matrix.year }}" = "2026" ] && END="2026-11-20"
          python3 scripts/dukascopy-fetch.py out "${{ matrix.year }}-01-01" "$END" "${{ matrix.symbol }}" || true
          ls -la out/*/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fx-${{ matrix.symbol }}-${{ matrix.year }}
          path: out
          if-no-files-found: ignore
  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge and push to fxdata
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch fxdata "$URL" fxdata
          for d in parts/*; do
            [ -f "$d/LOG.txt" ] && cat "$d/LOG.txt" >> fxdata/LOG.txt
            for s in "$d"/*/; do [ -d "$s" ] && mkdir -p "fxdata/$(basename "$s")" && cp "$s"/*.csv.gz "fxdata/$(basename "$s")/" 2>/dev/null; done
          done
          cd fxdata
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit --quiet -m "fxdata matrix $(date -u +%FT%TZ)"
          git push --quiet origin fxdata
          find . -name "*.csv.gz" | sort | tr '\n' ' '
