name: fx-data
# Dukascopy 1-minute candles (gold, FX majors, index CFDs) into the `fxdata` branch (experiments/first-candle-preregistration.md).
on:
  workflow_dispatch:
    inputs:
      args:
        description: "probe, or: START END SYMBOLS (e.g. 2016-01-01 2026-09-30 XAUUSD,EURUSD)"
        default: probe

permissions:
  contents: write

concurrency:
  group: fx-branch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Check out the fxdata branch (create it on the first run)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin fxdata >/dev/null; then
            git clone --quiet --depth 1 --branch fxdata "$URL" fxdata
          else
            mkdir fxdata && cd fxdata && git init --quiet -b fxdata && git remote add origin "$URL"
          fi
      - name: Download
        run: python3 scripts/dukascopy-fetch.py fxdata ${{ inputs.args }}
      - name: Commit and push
        if: always()
        run: |
          cd fxdata
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit --quiet -m "fxdata $(date -u +%FT%TZ)"
          git push --quiet origin fxdata
          tail -n 20 LOG.txt | while read -r line; do echo "::notice title=fxdata::$line"; done
