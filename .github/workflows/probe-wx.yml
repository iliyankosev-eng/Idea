name: probe-wx
# One-off research probes (sites the sandbox cannot reach). Raw results go to the `probe-wx` branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/probe-weather-claims.mjs", ".github/workflows/probe-wx.yml", "scripts/weather-claims.json"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        run: node scripts/probe-weather-claims.mjs out
      - name: Push raw results to the probe branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init --quiet -b probe-wx
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "probe $(date -u +%FT%TZ)"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-wx
          while read -r line; do echo "::notice title=probe-wx::$line"; done < LOG.txt
