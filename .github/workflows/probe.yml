name: probe-sources
# One-off check: which data sources answer from GitHub's servers. Results are written as annotations.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          UA="Iliyan Kosev personal research iliyan.v.kosev@gmail.com"
          probe() {
            name="$1"; url="$2"
            code=$(curl -sS -A "$UA" -o body.bin -w '%{http_code}' --max-time 30 -L "$url" || echo ERR)
            size=$(stat -c %s body.bin 2>/dev/null || echo 0)
            head=$(head -c 120 body.bin 2>/dev/null | tr -d '\n\r' | tr -c '[:print:]' '.')
            echo "::notice title=$name::HTTP $code, $size bytes: $head"
          }
          probe binance-vision-1m-zip "https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2026-08.zip"
          probe binance-api "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2"
          probe binance-data-api "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2"
          probe binance-us "https://api.binance.us/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2"
          probe coinbase "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400"
          probe kraken "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440"
          probe coingecko "https://api.coingecko.com/api/v3/ping"
          probe stooq-spy "https://stooq.com/q/d/l/?s=spy.us&i=d"
          probe yahoo-1m "https://query1.finance.yahoo.com/v8/finance/chart/SPY?range=1d&interval=1m"
          probe alpaca-nokey "https://data.alpaca.markets/v2/stocks/bars?symbols=SPY&timeframe=1Min&limit=2"
          probe sec-submissions "https://data.sec.gov/submissions/CIK0000320193.json"
          probe sec-form4-index "https://www.sec.gov/Archives/edgar/daily-index/2026/QTR3/"
          probe fred-dgs10 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10"
          probe tradingview-rted "https://www.tradingview.com/u/RTED_Investing/"
          probe coinmetrics-api "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=PriceUSD&frequency=1d&page_size=2&paging_from=end"
