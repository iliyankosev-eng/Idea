name: probe-hl2
# One-off research probes (sites the sandbox cannot reach). Raw results go to the `probe` branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/hl-wallets-apex.json", ".github/workflows/probe-hl2.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch
        run: node scripts/probe-hyperliquid.mjs out scripts/hl-wallets-apex.json
      - name: Push raw results to the probe branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init --quiet -b probe-hl2
          git config user.name "probe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "probe $(date -u +%FT%TZ)"
          git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-hl2
          while read -r line; do echo "::notice title=probe-hl2::$line"; done < LOG.txt
