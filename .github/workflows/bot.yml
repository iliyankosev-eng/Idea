name: bot
# Paper-trading bot (src/bot/run.ts): DT3 ORB on QQQ + DT8 RSI(2) on SPY. Logs go to the `botlog` branch.
# Trades on the Alpaca PAPER account of ALPACA_PAPER_KEY_ID / ALPACA_PAPER_SECRET_KEY, or of ALPACA_KEY_ID / ALPACA_SECRET_KEY
# when those are not set. Manual runs default to a dry run (dry_run=1): decisions are logged, no orders are sent.
# Started by workflow_dispatch from cron-job.org at 09:45 and 15:35 New York (mode=open / mode=close, dry_run=0)
# and at minutes 28 and 58 from 09:58 to 15:28 New York (mode=nb: noise band checks at :00 and :30);
# late starts keep the paid-for waiting short (GitHub Actions minutes).
# GitHub's own cron is not used: in this repository scheduled runs started 5-9 hours late.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "open, nb, close or check (check = no waiting, no orders, prints today's decisions)"
        default: check
      dry_run:
        description: "1 = never send orders"
        default: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check out the botlog branch (create it on the first run)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin botlog >/dev/null; then
            git clone --quiet --depth 1 --branch botlog "$URL" botlog
          else
            mkdir botlog && cd botlog && git init --quiet -b botlog && git remote add origin "$URL"
          fi
      - name: Run
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          npx tsx src/bot/run.ts "$INPUT_MODE"
      - name: Push the logs
        if: always()
        run: |
          cd botlog
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to log"; exit 0; fi
          git commit --quiet -m "botlog $(date -u +%FT%TZ)"
          git push --quiet origin botlog
          tail -n 30 "$(ls -t *.log | head -1)" | while read -r line; do echo "::notice title=bot::$line"; done
      - name: Alarm (open a GitHub issue when the run failed; GitHub then e-mails the repository owner)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          LOG="$(ls -t botlog/*.log 2>/dev/null | head -1)"
          { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo "Last log lines:"; echo '```'; [ -n "$LOG" ] && tail -n 15 "$LOG"; echo '```'; } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Bot run failed: $INPUT_MODE $(date -u +%F)" --body-file body.md
